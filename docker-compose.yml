services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mettav-inventory-app
    image: mettav-inventory:latest
    restart: unless-stopped
    ports:
      - "${PORT:-89}:89"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:89/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
