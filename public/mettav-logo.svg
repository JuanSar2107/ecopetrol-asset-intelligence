<svg xmlns="http://www.w3.org/2000/svg" viewBox="62 14 336 354" width="672" height="708">
  <defs>
    <linearGradient id="spindleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8dbedb"/>
      <stop offset="30%" stop-color="#cbe5f6"/>
      <stop offset="70%" stop-color="#a4cee5"/>
      <stop offset="100%" stop-color="#82b5d4"/>
    </linearGradient>
  </defs>

  <!-- Clean background for standalone rendering -->
  <rect x="62" y="14" width="336" height="354" fill="#ffffff"/>

  <!-- CONCENTRIC TARGET RIPPLES (Perspective Ellipses) -->
  <g id="ripples">
    <!-- Outer Ellipse -->
    <ellipse cx="230" cy="204" rx="160" ry="46" fill="none" stroke="#002f5a" stroke-width="7.5" stroke-linecap="round"/>
    
    <!-- Middle Ellipse -->
    <ellipse cx="230" cy="204" rx="112" ry="32" fill="none" stroke="#002f5a" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Inner Ellipse -->
    <ellipse cx="230" cy="204" rx="64" ry="18" fill="none" stroke="#002f5a" stroke-width="6.5" stroke-linecap="round"/>
    
    <!-- Center Target Hole -->
    <ellipse cx="230" cy="204" rx="26" ry="7.5" fill="none" stroke="#002f5a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- CNC SPINDLE & MILLING/DRILLING BIT -->
  <g id="spindle">
    <!-- 1. Upper Arbor / Top Cylinder -->
    <rect x="186" y="20" width="88" height="66" rx="10" ry="10" 
          fill="url(#spindleGrad)" stroke="#002f5a" stroke-width="7.5" stroke-linejoin="round"/>
    <!-- Top internal groove line -->
    <line x1="187" y1="42" x2="273" y2="42" stroke="#002f5a" stroke-width="5.5"/>

    <!-- 2. Main Middle Collar / Flange (Wider) -->
    <rect x="174" y="86" width="112" height="38" rx="8" ry="8" 
          fill="url(#spindleGrad)" stroke="#002f5a" stroke-width="7.5" stroke-linejoin="round"/>

    <!-- 3. Tool Holder Neck / Spindle Collar -->
    <path d="M 208 124 L 208 148 L 252 148 L 252 124 Z" 
          fill="url(#spindleGrad)" stroke="#002f5a" stroke-width="7" stroke-linejoin="round"/>

    <!-- 4. Drill / Milling Bit Body penetrating downwards into center -->
    <path d="M 210 148 L 210 186 C 210 198 224 207 230 210 C 236 207 250 198 250 186 L 250 148 Z" 
          fill="url(#spindleGrad)" stroke="#002f5a" stroke-width="7.5" stroke-linejoin="round"/>
    
    <!-- Helical Cutting Spiral Flutes (Dark Blue Precision Grooves) -->
    <path d="M 211 160 L 249 150" stroke="#002f5a" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 211 176 L 249 166" stroke="#002f5a" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 215 194 L 245 184" stroke="#002f5a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g id="typography" fill="#002f5a" text-anchor="middle">
    <!-- METTAV in bold geometric sans-serif matching uploaded corporate logo -->
    <text x="230" y="308" 
          font-family="system-ui, -apple-system, 'Montserrat', 'Liberation Sans', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" 
          font-size="65" 
          letter-spacing="4">METTAV</text>

    <!-- GROUP SAS spaced out beneath -->
    <text x="230" y="358" 
          font-family="system-ui, -apple-system, 'Montserrat', 'Liberation Sans', 'Helvetica Neue', Arial, sans-serif" 
          font-weight="800" 
          font-size="28" 
          letter-spacing="12">GROUP SAS</text>
  </g>
</svg>